[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=255,248,251,245
ContextTitle=Open Settings
ContextAction=[!CommandMeasure MeasureWeather "OpenSettings()"]
ContextTitle2=Refresh Weather
ContextAction2=[!CommandMeasure MeasureWeather "RefreshWeather()"]

[Variables]
WidgetWidth=300
Ink=77,59,70
Accent=255,200,221
Muted=144,121,134
WeatherLocation=Set your location in Settings
Temperature=--
Condition=Open Settings to configure weather
FeelsLike=--
Humidity=--
Wind=--
Updated=Not updated
WeatherIcon=cloudy
WeatherStatus=Configure weather in Settings

[MeasureWeather]
Measure=Script
ScriptFile=#@#Scripts\Weather.lua
UpdateDivider=1

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,390,18 | Fill Color 255,248,251,245 | StrokeWidth 2 | Stroke Color #Accent#
W=300
H=390

[MeterTitle]
Meter=String
X=22
Y=18
W=250
H=24
Text=AethesticWeather
FontFace=Segoe UI
FontSize=14
FontWeight=700
FontColor=#Ink#
AntiAlias=1

[MeterLocation]
Meter=String
X=22
Y=48
W=250
H=24
Text=#WeatherLocation#
FontFace=Segoe UI
FontSize=12
FontColor=#Muted#
AntiAlias=1
ClipString=1
DynamicVariables=1

[MeterIcon]
Meter=Image
X=24
Y=88
W=96
H=96
ImageName=#@#Images\#WeatherIcon#.png
DynamicVariables=1

[MeterTemperature]
Meter=String
X=128
Y=92
W=145
H=70
Text=#Temperature#°
FontFace=Segoe UI Light
FontSize=42
FontColor=#Ink#
AntiAlias=1
DynamicVariables=1

[MeterCondition]
Meter=String
X=24
Y=192
W=250
H=40
Text=#Condition#
FontFace=Segoe UI
FontSize=15
FontColor=#Ink#
AntiAlias=1
DynamicVariables=1
ClipString=1

[MeterFeelsLike]
Meter=String
X=24
Y=250
W=250
H=22
Text=Feels like  #FeelsLike#°
FontFace=Segoe UI
FontSize=11
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1

[MeterHumidity]
Meter=String
X=24
Y=276
W=250
H=22
Text=Humidity  #Humidity#
FontFace=Segoe UI
FontSize=11
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1

[MeterWind]
Meter=String
X=24
Y=302
W=250
H=22
Text=Wind  #Wind#
FontFace=Segoe UI
FontSize=11
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1

[MeterStatus]
Meter=String
X=24
Y=344
W=250
H=30
Text=#WeatherStatus#
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
ClipString=1
